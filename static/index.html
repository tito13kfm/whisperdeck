<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhisperDeck — Signal Rack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/rack.css">
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="page-login" style="min-height:100vh;display:none;align-items:center;justify-content:center">
  <div style="width:400px;display:flex;flex-direction:column;gap:16px">
    <div style="text-align:center;margin-bottom:6px">
      <div style="font-family:var(--f-cond);font-weight:700;font-size:26px;letter-spacing:0.05em;text-transform:uppercase">WhisperDeck</div>
      <div class="t-cap" style="font-size:10.5px;letter-spacing:0.16em;margin-top:4px">Signal Rack · V0.8</div>
    </div>
    <form id="auth-form" class="unit" style="padding:24px 30px;display:flex;flex-direction:column;gap:14px;border-radius:3px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div id="auth-title" style="font-family:var(--f-cond);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:0.05em">Operator sign-in</div>
        <div style="display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10px;color:var(--label-dim);text-transform:uppercase;letter-spacing:0.08em">
          <span class="led-dot" style="background:var(--amber);box-shadow:0 0 5px var(--amber)"></span>Standby
        </div>
      </div>
      <div class="field">
        <label class="t-label" for="auth-user">Operator</label>
        <input class="inp" id="auth-user" type="text" placeholder="username" autocomplete="username">
      </div>
      <div class="field">
        <label class="t-label" for="auth-pass">Passcode</label>
        <input class="inp" id="auth-pass" type="password" autocomplete="current-password">
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px">
        <div id="auth-led" class="led-dot"></div>
        <button id="auth-submit" type="submit" class="key key--wide" style="width:100%;height:40px">Power on</button>
      </div>
      <div style="width:100%;border-top:1px solid var(--edge);margin:4px 0 2px"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px" id="auth-recovery-links">
        <button id="auth-forgot-username" type="button" class="auth-link">Find username</button>
        <button id="auth-reset-code" type="button" class="auth-link">I have a reset code</button>
      </div>
    </form>
    <button id="auth-toggle" type="button" style="background:none;border:none;font-family:var(--f-mono);font-size:11px;color:var(--label-dim);cursor:pointer;text-align:center">No account? Register</button>
  </div>
</div>

<!-- ══════════════════ APP SHELL ══════════════════ -->
<div id="app-shell" style="display:none">

  <!-- rail -->
  <nav class="rail">
    <div class="rail-logo">
      <div class="name">WhisperDeck</div>
      <div class="sub">Signal Rack · V0.8</div>
    </div>
    <button class="rail-btn" data-nav="dashboard">
      <span class="led"></span><span class="lbl">Monitor</span><span class="badge"></span>
    </button>
    <button class="rail-btn" data-nav="transcribe">
      <span class="led"></span><span class="lbl">Transcribe</span><span class="badge" id="nav-badge-transcribe"></span>
    </button>
    <button class="rail-btn" data-nav="transcripts">
      <span class="led"></span><span class="lbl">Tape library</span><span class="badge" id="nav-badge-transcripts"></span>
    </button>
    <button class="rail-btn" data-nav="queue">
      <span class="led"></span><span class="lbl">Queue</span><span class="badge" id="nav-badge-queue"></span>
    </button>
    <button class="rail-btn" data-nav="voices">
      <span class="led"></span><span class="lbl">Voice roster</span><span class="badge" id="nav-badge-voices"></span>
    </button>
    <button class="rail-btn" data-nav="files">
      <span class="led"></span><span class="lbl">Files</span><span class="badge" id="nav-badge-files"></span>
    </button>
    <button class="rail-btn" data-nav="settings">
      <span class="led"></span><span class="lbl">Service panel</span><span class="badge"></span>
    </button>
    <div class="rail-foot">
      <div class="row"><span>Storage</span><span id="rail-storage-text">— / 500 min</span></div>
      <div class="bargraph slim" id="rail-storage-leds"></div>
      <div style="display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:9.5px;color:var(--label-dim);text-transform:uppercase;letter-spacing:0.08em;margin-top:8px">
        <span class="led-dot" style="background:var(--green);box-shadow:0 0 5px var(--green)"></span><span id="rail-operator">Operator: local</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:9.5px;color:var(--label-dim);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px">
        <span class="led-dot" id="net-led"></span><span>Online</span>
      </div>
    </div>
  </nav>

  <!-- main -->
  <div class="main-col">
    <div class="content">
      <div class="holes holes-l"></div>
      <div class="holes holes-r"></div>

      <div class="page" id="page-dashboard"></div>
      <div class="page" id="page-transcribe"></div>
      <div class="page" id="page-transcripts"></div>
      <div class="page" id="page-queue"></div>
      <div class="page" id="page-detail"></div>
      <div class="page" id="page-voices"></div>
      <div class="page" id="page-files"></div>
      <div class="page" id="page-settings"></div>
    </div>
  </div>
</div>

<!-- shared modal mount (ONE primitive; content swapped per use) -->
<div class="modal-overlay" id="modal-overlay">
  <div class="unit modal" id="modal-box" role="dialog" aria-modal="true"></div>
</div>

<div id="toast-wrap"></div>

<input type="file" id="file-input" accept=".mp3,.wav,.m4a,.flac,.ogg,.mp4,audio/*,video/mp4" style="display:none">

<script src="/static/rack.js"></script>
</body>
</html>
