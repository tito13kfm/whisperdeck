[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# testpaths only applies when no path is given on the command line. `pytest .`
# or `pytest <repo>` walks everything, and scripts/ holds manual probes that
# talk to a live Lemonade server at import time. Four of them used to be named
# test_*.py: two errored on missing fixtures and two silently fired HTTP
# requests during collection, adding ~40s each. They are probe_*.py now, and
# this keeps the directory out of collection regardless of what lands in it.
norecursedirs = scripts
addopts = -m "not e2e"
markers =
    e2e: end-to-end tests that drive a real browser via Playwright. Opt-in: `pytest -m e2e`. Excluded by default.
